<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto &bull; Love Jones</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="LoveJones pic1.jpeg">

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #111111;
      --accent-color: #9e3a2b;
      --text-main: #f4ecd8;
      --text-muted: #b8b09f;
      --border-color: #26211f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Lora', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.85;
    }

    header {
      width: 100%;
      padding: 2.8rem 2.5rem;
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-logo {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 700;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .nav-link {
      font-family: 'Space Grotesk', sans-serif;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      padding-bottom: 4px;
      border-bottom: 1.5px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text-main);
      border-bottom-color: var(--accent-color);
    }

    main {
      flex: 1;
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
      padding: 6.5rem 2.5rem;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.6rem;
      letter-spacing: 0.08em;
      margin-bottom: 1.5rem;
      color: var(--text-main);
    }

    p {
      color: var(--text-muted);
      font-size: 1.15rem;
      max-width: 600px;
    }

    footer {
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.85rem;
      color: #6d665b;
    }

    @media (max-width: 768px) {
      main {
        padding: 4rem 1.8rem;
      }
      footer {
        flex-direction: column;
        gap: 0.8rem;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand-logo">Love Jones</a>
    <nav class="header-nav">
      <a class="nav-link" href="https://substack.com/@loveejonnes" target="_blank" rel="noopener noreferrer">DROPGEMS</a>
      <a class="nav-link active" href="contacto.html">CONTACTO</a>
    </nav>
  </header>

  <main>
    <h1>Contacto</h1>
    <p>Próximamente información de contacto y canales de correspondencia.</p>
  </main>

  <footer>
    <div>&copy; Bogotá, Colombia.</div>
    <div>Love Jones</div>
  </footer>

</body>
</html>
