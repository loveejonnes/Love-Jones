<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Love Jones — Dropgems</title>
  
  <link rel="icon" type="image/jpeg" href="LoveJones pic1.jpeg">

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0c0b0a;
      --card-bg: #141312;
      --accent-color: #8f3024;
      --accent-hover: #b03d2e;
      --gold-muted: #c2a661;
      --text-main: #f2ede4;
      --text-muted: #a89f91;
      --border-color: #24201d;
      --font-mono: 'Space Mono', 'Courier Prime', monospace;
      --font-serif: 'Lora', Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-serif);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    header {
      width: 100%;
      padding: 2.8rem 2.5rem;
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--border-color);
    }

    .brand-logo {
      font-family: var(--font-mono);
      font-size: 1.25rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 700;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 2.2rem;
    }

    .nav-link {
      font-family: var(--font-mono);
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      padding-bottom: 4px;
      border-bottom: 1px dashed transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--text-main);
      border-bottom-color: var(--gold-muted);
    }

    /* Área central limpia */
    main {
      flex: 1;
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
      padding: 4.5rem 2.5rem 7rem 2.5rem;
    }

    footer {
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
      padding: 2.8rem 2.5rem;
      border-top: 1px dashed var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      color: #5c554b;
    }

    @media (max-width: 768px) {
      header { padding: 1.8rem 1.4rem; }
      main { padding: 3rem 1.4rem 5rem 1.4rem; }
      footer { flex-direction: column; gap: 0.6rem; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <a href="./" class="brand-logo">Love Jones</a>
    <nav class="header-nav">
      <a class="nav-link active" href="dropgems.html">DROPGEMS</a>
      <a class="nav-link" href="archivo.html">ARCHIVO</a>
      <a class="nav-link" href="contacto.html">CONTACTO</a>
    </nav>
  </header>

  <!-- Espacio en blanco para construir las publicaciones -->
  <main></main>

  <footer>
    <div>&copy; Bogotá, Colombia.</div>
    <div>Love Jones</div>
  </footer>

  <script>
    if (window.location.pathname.endsWith('/dropgems.html')) {
      const cleanPath = window.location.pathname.replace('/dropgems.html', '/dropgems');
      window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
    }
  </script>
</body>
</html>
