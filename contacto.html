<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — Love Jones</title>
  <link rel="icon" type="image/jpeg" href="LoveJones pic1.jpeg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0c0b0a;
      --card-bg: #141311;
      --accent-color: #9e3a2b;
      --text-main: #f2ede4;
      --text-muted: #a69f92;
      --border-color: #24201d;
      --font-serif: 'Lora', Georgia, serif;
      --font-display: 'Cinzel', serif;
      --font-mono: 'Space Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-serif);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.85;
      position: relative;
    }

    header {
      width: 100%;
      padding: 2.8rem 2.5rem;
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--border-color);
    }

    .brand-logo {
      font-family: var(--font-display);
      font-size: 1.4rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 700;
    }

    .header-nav { display: flex; align-items: center; gap: 2rem; }

    .nav-link {
      font-family: var(--font-mono);
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 0.2s ease, border-color 0.2s ease;
      padding-bottom: 3px;
      border-bottom: 1.5px solid transparent;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--text-main);
      border-bottom-color: var(--accent-color);
    }

    main {
      flex: 1;
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
      padding: 6rem 2.5rem;
    }

    .contact-card {
      background: var(--card-bg);
      border: 1px dashed var(--border-color);
      padding: 3rem;
      max-width: 640px;
    }

    .contact-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      color: #c2a661;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
      display: block;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      letter-spacing: 0.08em;
      color: var(--text-main);
      margin-bottom: 1.2rem;
    }

    p {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.85;
      margin-bottom: 1.8rem;
    }

    .contact-mail {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      color: var(--text-main);
      text-decoration: none;
      border-bottom: 1px solid var(--accent-color);
      padding-bottom: 2px;
      transition: color 0.2s ease;
    }

    .contact-mail:hover {
      color: var(--accent-color);
    }

    footer {
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
      padding: 3rem 2.5rem;
      border-top: 1px dashed var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      color: #615b52;
    }

    @media (max-width: 820px) {
      header { padding: 2rem 1.5rem; }
      .header-nav { gap: 1.2rem; flex-wrap: wrap; }
      main { padding: 3.5rem 1.5rem; }
      .contact-card { padding: 2rem 1.5rem; }
      footer { flex-direction: column; gap: 1rem; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <a href="./" class="brand-logo">Love Jones</a>
    <nav class="header-nav">
      <a class="nav-link" href="https://substack.com/@loveejonnes" target="_blank" rel="noopener noreferrer">DROPGEMS</a>
      <a class="nav-link" href="mi-trabajo.html">MI TRABAJO</a>
      <a class="nav-link" href="mecenazgo.html">MECENAZGO</a>
      <a class="nav-link active" href="contacto.html">CONTACTO</a>
    </nav>
  </header>

  <main>
    <div class="contact-card">
      <span class="contact-tag">// CORRESPONDENCIA & ENLACE</span>
      <h1>Contacto</h1>
      <p>
        Para consultas editoriales, colaboraciones de investigación o curaduría musical independiente:
      </p>
      <a href="mailto:loveejonnes@gmail.com" class="contact-mail">loveejonnes@gmail.com</a>
    </div>
  </main>

  <footer>
    <div>&copy; Bogotá, Colombia.</div>
    <div>Love Jones</div>
  </footer>

</body>
</html>
