<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Jones — Contacto</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="LoveJones pic1.jpeg">

  <!-- Tipografías: Monoespaciada técnica + Romana de lectura -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0d0c0b;
      --card-bg: #121110;
      --accent-color: #9e3527;
      --accent-hover: #b83f30;
      --text-main: #dfd7c8;
      --text-muted: #8c8476;
      --border-color: #2b2622;
      --input-bg: #141211;
      --font-mono: 'Space Mono', 'Courier Prime', monospace;
      --font-serif: 'Lora', Georgia, serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-serif);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.85;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* Grano analógico de fondo */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Encabezado */
    header {
      width: 100%;
      padding: 2.6rem 2.5rem;
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--border-color);
    }

    .brand-logo {
      font-family: var(--font-mono);
      font-size: 1.25rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 700;
      transition: opacity 0.2s ease;
    }

    .brand-logo:hover {
      opacity: 0.85;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 2.2rem;
    }

    .nav-link {
      font-family: var(--font-mono);
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      padding-bottom: 4px;
      border-bottom: 1px dashed transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text-main);
      border-bottom-color: var(--accent-color);
    }

    /* Contenedor Principal */
    main {
      flex: 1;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 5rem 2rem;
    }

    .contact-header {
      margin-bottom: 3.5rem;
    }

    h1 {
      font-family: var(--font-mono);
      font-size: 2.2rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-main);
      line-height: 1.2;
      margin-bottom: 1.4rem;
    }

    .contact-desc {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .contact-desc a {
      color: var(--text-main);
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s ease;
    }

    .contact-desc a:hover {
      color: var(--accent-color);
    }

    /* Formulario */
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
    }

    input, textarea {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px dashed var(--border-color);
      border-radius: 3px;
      padding: 0.95rem 1.1rem;
      color: var(--text-main);
      font-family: var(--font-serif);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, textarea:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 10px rgba(158, 53, 39, 0.25);
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    .btn-submit {
      align-self: flex-start;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-main);
      background-color: var(--card-bg);
      border: 1px dashed var(--border-color);
      padding: 0.85rem 2.2rem;
      border-radius: 3px;
      cursor: pointer;
      transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease;
    }

    .btn-submit:hover {
      background-color: #171513;
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    /* Pie de página */
    footer {
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem;
      border-top: 1px dashed var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      color: #5c554b;
    }

    @media (max-width: 820px) {
      header {
        padding: 1.8rem 1.4rem;
      }
      .brand-logo {
        font-size: 1.1rem;
      }
      .header-nav {
        gap: 1.4rem;
      }
      main {
        padding: 3.2rem 1.4rem;
      }
      h1 {
        font-size: 1.8rem;
      }
      .btn-submit {
        width: 100%;
      }
      footer {
        flex-direction: column;
        gap: 0.6rem;
        text-align: center;
        padding: 2rem 1.4rem;
      }
    }
  </style>
</head>
<body>

  <!-- Encabezado con ARCHIVO en el centro -->
  <header>
    <a href="./" class="brand-logo">Love Jones</a>
    <nav class="header-nav">
      <a class="nav-link" href="https://substack.com/@loveejonnes" target="_blank" rel="noopener noreferrer">DROPGEMS</a>
      <a class="nav-link" href="archivo.html">ARCHIVO</a>
      <a class="nav-link active" href="contacto.html">CONTACTO</a>
    </nav>
  </header>

  <!-- Contenido Central -->
  <main>
    <div class="contact-header">
      <h1>Contacto</h1>
      <p class="contact-desc">
        Para consultas, colaboraciones, propuestas editoriales, promoción o divulgación de música escribe mediante este formulario o directamente a <a href="mailto:loveejonnes1@gmail.com">loveejonnes1@gmail.com</a>.
      </p>
    </div>

    <form class="contact-form" action="https://formsubmit.co/loveejonnes1@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="Nuevo mensaje desde la web Love Jones">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <input type="text" name="_honey" style="display:none">

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          autocomplete="email" 
          required 
          placeholder="tu-correo@ejemplo.com"
        >
      </div>

      <div class="form-group">
        <label for="affair">Asunto</label>
        <input 
          type="text" 
          id="affair" 
          name="affair" 
          required
          placeholder="Motivo del mensaje"
        >
      </div>

      <div class="form-group">
        <label for="message">Mensaje</label>
        <textarea 
          id="message" 
          name="message" 
          required 
          placeholder="Escribe aquí tu mensaje..."
        ></textarea>
      </div>

      <button type="submit" class="btn-submit">Enviar mensaje</button>
    </form>
  </main>

  <!-- Pie de página -->
  <footer>
    <div>&copy; Bogotá, Colombia.</div>
    <div>Love Jones</div>
  </footer>

  <script>
    if (window.location.pathname.endsWith('/contacto.html')) {
      const cleanPath = window.location.pathname.replace('/contacto.html', '/contacto');
      window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
    }
  </script>
</body>
</html>
