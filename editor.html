<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Jones — Taller Editorial</title>
  
  <link rel="icon" type="image/jpeg" href="LoveJones pic1.jpeg">

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0c0b0a;
      --card-bg: #141312;
      --accent-color: #8f3024;
      --accent-hover: #b03d2e;
      --gold-muted: #c2a661;
      --text-main: #f2ede4;
      --text-muted: #a89f91;
      --border-color: #24201d;
      --font-mono: 'Space Mono', 'Courier Prime', monospace;
      --font-serif: 'Lora', Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-serif);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* Barra Superior Minimalista Estilo Substack */
    .substack-topbar {
      position: sticky;
      top: 0;
      background-color: rgba(12, 11, 10, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px dashed var(--border-color);
      z-index: 1000;
      padding: 0.9rem 2.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 1.4rem;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .brand-mark {
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .status-text {
      color: #6d665b;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
    }

    .status-text.saved { color: var(--gold-muted); }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    .btn-top {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.45rem 1rem;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .btn-top:hover {
      border-color: var(--gold-muted);
      color: #fff;
    }

    .btn-export-main {
      background: var(--accent-color);
      border-color: var(--accent-color);
      color: #fff;
      font-weight: 700;
    }

    .btn-export-main:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    /* Lienzo Central de Escritura */
    main {
      flex: 1;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 5rem 1.8rem 10rem 1.8rem;
      position: relative;
    }

    .doc-slug-meta {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 0.6rem;
    }

    .meta-field {
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--gold-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      flex: 1;
    }

    .title-field {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-mono);
      font-size: 2.1rem;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.04em;
      color: var(--text-main);
      margin-bottom: 0.8rem;
      text-transform: uppercase;
    }

    .title-field::placeholder { color: #3d3731; }

    .subtitle-field {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 3.5rem;
      line-height: 1.5;
    }

    .subtitle-field::placeholder { color: #3d3731; font-style: italic; }

    /* Área de Texto Enriquecido Substack */
    #editorArea {
      outline: none;
      font-size: 1.15rem;
      line-height: 2;
      color: var(--text-main);
      min-height: 480px;
    }

    #editorArea p {
      margin-bottom: 2.2rem;
      text-align: justify;
      hyphens: auto;
      letter-spacing: 0.012em;
    }

    #editorArea h2 {
      font-family: var(--font-mono);
      font-size: 1.28rem;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 3.6rem 0 1.2rem 0;
    }

    #editorArea h3 {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      color: var(--gold-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 2.6rem 0 1rem 0;
    }

    #editorArea blockquote {
      border-left: 2px solid var(--accent-color);
      padding: 0.5rem 0 0.5rem 1.6rem;
      margin: 2.8rem 0;
      color: #d1c8ba;
      font-style: italic;
      font-size: 1.15rem;
    }

    #editorArea .pull-quote {
      text-align: center;
      font-size: 1.45rem;
      font-style: italic;
      line-height: 1.6;
      color: var(--gold-muted);
      margin: 3.5rem 2rem;
      padding: 1.5rem 0;
      border-top: 1px dashed var(--border-color);
      border-bottom: 1px dashed var(--border-color);
    }

    #editorArea .divider-dots {
      text-align: center;
      letter-spacing: 1.2em;
      color: var(--gold-muted);
      margin: 3.5rem 0;
      user-select: none;
    }

    #editorArea a {
      color: var(--text-main);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* Botón Superíndice de Nota en Texto */
    .footnote-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-muted);
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.76rem;
      vertical-align: super;
      text-decoration: none;
      cursor: pointer;
      margin: 0 0.2rem;
      background: rgba(194, 166, 97, 0.1);
      border: 1px dashed #3a3222;
      padding: 0.05rem 0.35rem;
      border-radius: 2px;
      user-select: none;
    }

    .footnote-button:hover, .footnote-button.active {
      background: var(--gold-muted);
      color: #0c0b0a;
    }

    /* Láminas de Archivo */
    .editorial-plate {
      margin: 3.5rem 0;
      border: 1px dashed var(--border-color);
      background-color: #11100f;
      padding: 1.2rem;
    }

    .plate-img-wrap {
      width: 100%;
      background-color: #080706;
      display: flex;
      justify-content: center;
    }

    .plate-img-wrap img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .plate-caption {
      margin-top: 1rem;
      padding-top: 0.8rem;
      border-top: 1px dashed var(--border-color);
      font-family: var(--font-mono);
      font-size: 0.76rem;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .plate-number {
      color: var(--gold-muted);
      font-weight: 700;
      margin-right: 0.4rem;
    }

    /* Sección de Notas al Pie (Abajo en el Editor) */
    .footnotes-section {
      margin-top: 5rem;
      padding-top: 2rem;
      border-top: 1px dashed var(--border-color);
    }

    .footnotes-title {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold-muted);
      margin-bottom: 1.2rem;
    }

    #footnotesList {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.7;
      padding-left: 1.4rem;
      outline: none;
    }

    #footnotesList li { margin-bottom: 0.8rem; padding-right: 1rem; }

    /* ========================================================
       BARRA FLOTANTE CONTEXTUAL DE SUBSTACK (BUBBLE MENU)
       ======================================================== */
    .bubble-menu {
      position: absolute;
      display: none;
      background: #181614;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 0.3rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      z-index: 2000;
      gap: 0.2rem;
      align-items: center;
    }

    .bubble-menu.active { display: flex; }

    .bubble-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      padding: 0.35rem 0.55rem;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.15s ease;
    }

    .bubble-btn:hover {
      background: rgba(194, 166, 97, 0.15);
      color: var(--gold-muted);
    }

    .bubble-divider {
      width: 1px;
      height: 14px;
      background: var(--border-color);
      margin: 0 0.15rem;
    }

    /* ========================================================
       BOTÓN '+' LATERAL Y MENÚ DE BLOQUES SUBSTACK
       ======================================================== */
    .side-block-trigger {
      position: absolute;
      left: -48px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px dashed var(--border-color);
      background: #141312;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 1.1rem;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1500;
      transition: all 0.2s ease;
    }

    .side-block-trigger:hover, .side-block-trigger.active {
      border-color: var(--gold-muted);
      color: var(--gold-muted);
      transform: scale(1.05);
    }

    .block-dropdown {
      position: absolute;
      left: -48px;
      top: 42px;
      background: #161514;
      border: 1px dashed var(--border-color);
      width: 250px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.9);
      display: none;
      flex-direction: column;
      padding: 0.4rem;
      z-index: 1600;
      border-radius: 4px;
    }

    .block-dropdown.active { display: flex; }

    .block-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.6rem 0.8rem;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.76rem;
      text-align: left;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.15s ease;
    }

    .block-item:hover {
      background: rgba(194, 166, 97, 0.1);
      color: var(--gold-muted);
    }

    .block-item-icon {
      color: var(--gold-muted);
      font-size: 0.85rem;
      width: 18px;
      text-align: center;
    }

    /* ========================================================
       BURBUJA FLOTANTE PARA LECTURA DE NOTAS (POPOVER)
       ======================================================== */
    .footnote-popover {
      position: absolute;
      z-index: 3000;
      width: min(340px, 90vw);
      background-color: #161514;
      border: 1px dashed var(--gold-muted);
      box-shadow: 0 14px 40px rgba(0,0,0,0.95);
      border-radius: 3px;
      padding: 1.1rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-main);
      line-height: 1.65;
      display: none;
      animation: fadeInNote 0.18s ease;
    }

    @keyframes fadeInNote {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .popover-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px dashed var(--border-color);
      color: var(--gold-muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .popover-close {
      cursor: pointer;
      color: var(--text-muted);
      background: none;
      border: none;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    .popover-close:hover { color: var(--text-main); }

    /* ========================================================
       MODAL DE PREVISUALIZACIÓN EN VIVO
       ======================================================== */
    .preview-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 9, 8, 0.98);
      backdrop-filter: blur(12px);
      z-index: 4000;
      flex-direction: column;
    }

    .preview-modal.active { display: flex; }

    .preview-header {
      padding: 0.8rem 1.8rem;
      background: #141312;
      border-bottom: 1px dashed var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
    }

    .preview-body-container {
      flex: 1;
      overflow-y: auto;
      padding: 2.5rem 1rem;
      display: flex;
      justify-content: center;
    }

    .preview-viewport {
      background: var(--bg-color);
      border: 1px dashed var(--border-color);
      min-height: 100%;
      padding: 4.5rem 3rem;
      transition: width 0.3s ease;
      width: 100%;
      max-width: 760px;
    }

    .preview-viewport.mode-mobile {
      max-width: 390px;
      padding: 2.5rem 1.4rem;
      border: 1px solid #332d27;
      border-radius: 12px;
      margin-top: 1rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 768px) {
      .substack-topbar { padding: 0.8rem 1.2rem; }
      main { padding: 3rem 1.2rem 8rem 1.2rem; }
      .side-block-trigger { display: none !important; }
      .title-field { font-size: 1.55rem; }
      #editorArea p { text-align: left; }
    }
  </style>
</head>
<body>

  <!-- Barra Superior Minimalista -->
  <header class="substack-topbar">
    <div class="topbar-left">
      <a href="archivo.html" class="brand-mark">&larr; Love Jones</a>
      <span class="status-text" id="saveStatus">Guardado</span>
      <span>&bull;</span>
      <span id="wordMetric">0 palabras</span>
    </div>

    <div class="topbar-right">
      <button class="btn-top" type="button" onclick="openLivePreview()">Previsualizar</button>
      <button class="btn-top btn-export-main" type="button" onclick="exportHtmlFile()">Exportar Ensayo</button>
    </div>
  </header>

  <main>
    <!-- Metadatos de Publicación -->
    <div class="doc-slug-meta">
      <input type="text" id="docSlug" class="meta-field" placeholder="slug-del-ensayo" style="max-width: 200px;">
      <input type="text" id="docId" class="meta-field" placeholder="[TXT.01]" style="max-width: 90px;">
      <input type="text" id="docMeta" class="meta-field" placeholder="BOGOTÁ // ENSAYO MONOGRÁFICO // 2026">
    </div>

    <!-- Título y Subtítulo estilo Substack -->
    <input type="text" id="docTitle" class="title-field" placeholder="Título...">
    <input type="text" id="docSubtitle" class="subtitle-field" placeholder="Escribe un subtítulo descriptivo...">

    <!-- Gatillo Lateral del Menú de Bloques (+) -->
    <button type="button" class="side-block-trigger" id="sideTrigger" title="Añadir bloque">+</button>

    <!-- Menú Desplegable de Bloques -->
    <div class="block-dropdown" id="blockDropdown">
      <button type="button" class="block-item" onclick="insertBlock('h2')">
        <span class="block-item-icon">T</span> Título de sección (H2)
      </button>
      <button type="button" class="block-item" onclick="insertBlock('h3')">
        <span class="block-item-icon">t</span> Subtítulo (H3)
      </button>
      <button type="button" class="block-item" onclick="insertBlock('quote')">
        <span class="block-item-icon">&ldquo;</span> Cita en bloque
      </button>
      <button type="button" class="block-item" onclick="insertBlock('pullquote')">
        <span class="block-item-icon">&rdquo;</span> Cita destacada (Pull quote)
      </button>
      <button type="button" class="block-item" onclick="insertBlock('dots')">
        <span class="block-item-icon">&bull;&bull;&bull;</span> Separador temático
      </button>
      <button type="button" class="block-item" onclick="insertFootnoteAction()">
        <span class="block-item-icon">[1]</span> Nota al pie emergente
      </button>
      <button type="button" class="block-item" onclick="insertPlateAction()">
        <span class="block-item-icon">&#9633;</span> Lámina / Imagen de archivo
      </button>
    </div>

    <!-- Lienzo de Escritura Principal -->
    <div id="editorArea" contenteditable="true" spellcheck="false">
      <p>Comienza a escribir aquí tu ensayo. Selecciona cualquier parte del texto para que aparezca la barra flotante con opciones de estilo, o sitúate en una nueva línea para desplegar el botón (+) de bloques y notas al pie.</p>
    </div>

    <!-- Sección de Notas al Pie (Registro Inferior) -->
    <div class="footnotes-section" id="footnotesSection" style="display: none;">
      <div class="footnotes-title">Notas</div>
      <ol id="footnotesList" contenteditable="true" spellcheck="false"></ol>
    </div>
  </main>

  <!-- Barra de Formato Flotante (Bubble Menu) -->
  <div class="bubble-menu" id="bubbleMenu">
    <button type="button" class="bubble-btn" onmousedown="event.preventDefault()" onclick="execInline('bold')"><b>B</b></button>
    <button type="button" class="bubble-btn" onmousedown="event.preventDefault()" onclick="execInline('italic')"><i>I</i></button>
    <div class="bubble-divider"></div>
    <button type="button" class="bubble-btn" onmousedown="event.preventDefault()" onclick="execInline('formatBlock', '<h2>')">H2</button>
    <button type="button" class="bubble-btn" onmousedown="event.preventDefault()" onclick="execInline('formatBlock', '<h3>')">H3</button>
    <button type="button" class="bubble-btn" onmousedown="event.preventDefault()" onclick="applyBlockquoteInline()">Cita</button>
    <div class="bubble-divider"></div>
    <button type="button" class="bubble-btn" onmousedown="event.preventDefault()" onclick="insertInlineLink()">Enlace</button>
    <button type="button" class="bubble-btn" onmousedown="event.preventDefault()" onclick="insertFootnoteAction()" style="color:var(--gold-muted); font-weight:700;">[+ Nota]</button>
  </div>

  <!-- Burbuja Flotante para Notas (Popover) -->
  <div id="activePopover" class="footnote-popover">
    <div class="popover-header">
      <span id="popoverLabel">NOTA [1]</span>
      <button type="button" class="popover-close" onclick="closePopover()">&times;</button>
    </div>
    <div id="popoverContent"></div>
  </div>

  <!-- Modal de Previsualización -->
  <div class="preview-modal" id="previewModal">
    <div class="preview-header">
      <div style="display: flex; gap: 0.5rem;">
        <button class="btn-top" onclick="setPreviewDevice('desktop')">Escritorio</button>
        <button class="btn-top" onclick="setPreviewDevice('mobile')">Móvil</button>
      </div>
      <button class="btn-top" onclick="closeLivePreview()">&times; Cerrar Vista Previa (Esc)</button>
    </div>
    <div class="preview-body-container">
      <div class="preview-viewport" id="previewViewport">
        <div id="pvDocMeta" style="font-family:var(--font-mono); font-size:0.78rem; color:var(--gold-muted); letter-spacing:0.16em; text-transform:uppercase; margin-bottom:0.9rem;"></div>
        <h1 id="pvTitle" style="font-family:var(--font-mono); font-size:1.95rem; letter-spacing:0.05em; line-height:1.35; text-transform:uppercase; color:var(--text-main); margin-bottom:1rem;"></h1>
        <div id="pvSubtitle" style="font-family:var(--font-serif); font-size:1.25rem; font-style:italic; color:var(--text-muted); margin-bottom:3rem; border-bottom:1px dashed var(--border-color); padding-bottom:1.5rem;"></div>
        <article id="pvContent" class="article-body"></article>
        <div id="pvFootnotes" class="footnotes-section" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script>
    const editor = document.getElementById('editorArea');
    const fList = document.getElementById('footnotesList');
    const fSec = document.getElementById('footnotesSection');
    const slugInput = document.getElementById('docSlug');
    const idInput = document.getElementById('docId');
    const metaInput = document.getElementById('docMeta');
    const titleInput = document.getElementById('docTitle');
    const subtitleInput = document.getElementById('docSubtitle');
    const saveStatus = document.getElementById('saveStatus');
    const wordMetric = document.getElementById('wordMetric');

    const bubbleMenu = document.getElementById('bubbleMenu');
    const sideTrigger = document.getElementById('sideTrigger');
    const blockDropdown = document.getElementById('blockDropdown');
    const popover = document.getElementById('activePopover');
    const popContent = document.getElementById('popoverContent');
    const popLabel = document.getElementById('popoverLabel');

    let currentPopoverBtn = null;
    let savedSelectionRange = null;

    // Ejecución en línea para Bubble Menu
    function execInline(cmd, val = null) {
      document.execCommand(cmd, false, val);
      hideBubbleMenu();
      triggerAutoSave();
    }

    function applyBlockquoteInline() {
      const sel = window.getSelection();
      if (!sel.rangeCount) return;
      let node = sel.anchorNode;
      while (node && node !== editor && !['P', 'H2', 'H3', 'BLOCKQUOTE'].includes(node.nodeName)) {
        node = node.parentNode;
      }
      if (node && node.nodeName === 'BLOCKQUOTE') {
        document.execCommand('formatBlock', false, '<p>');
      } else {
        document.execCommand('formatBlock', false, '<blockquote>');
      }
      hideBubbleMenu();
      triggerAutoSave();
    }

    function insertInlineLink() {
      const url = prompt('Introduce la dirección web (URL):');
      if (url) {
        document.execCommand('createLink', false, url);
      }
      hideBubbleMenu();
      triggerAutoSave();
    }

    // Control de la Barra Flotante Contextual (Substack)
    function handleSelectionChange() {
      const sel = window.getSelection();
      if (!sel.rangeCount || sel.isCollapsed || !editor.contains(sel.anchorNode)) {
        hideBubbleMenu();
        return;
      }

      savedSelectionRange = sel.getRangeAt(0).cloneRange();
      const rect = sel.getRangeAt(0).getBoundingClientRect();
      const menuWidth = 260;

      let top = rect.top + window.scrollY - 46;
      let left = rect.left + window.scrollX + (rect.width / 2) - (menuWidth / 2);

      if (left < 15) left = 15;
      if (left + menuWidth > window.innerWidth - 15) left = window.innerWidth - menuWidth - 15;

      bubbleMenu.style.top = top + 'px';
      bubbleMenu.style.left = left + 'px';
      bubbleMenu.classList.add('active');
    }

    function hideBubbleMenu() {
      bubbleMenu.classList.remove('active');
    }

    // Menú de Bloques Lateral (+)
    function updateSideTriggerPosition() {
      const sel = window.getSelection();
      if (!sel.rangeCount || !editor.contains(sel.anchorNode)) {
        sideTrigger.style.display = 'none';
        blockDropdown.classList.remove('active');
        return;
      }

      let node = sel.anchorNode;
      if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;
      while (node && node.parentNode !== editor) {
        node = node.parentNode;
      }

      if (node && node.parentNode === editor) {
        const text = node.textContent.replace(/\u200B/g, '').trim();
        if (text === '') {
          const rect = node.getBoundingClientRect();
          const mainRect = document.querySelector('main').getBoundingClientRect();
          sideTrigger.style.top = (node.offsetTop + 2) + 'px';
          sideTrigger.style.display = 'flex';
          return;
        }
      }

      sideTrigger.style.display = 'none';
      blockDropdown.classList.remove('active');
    }

    sideTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const isActive = blockDropdown.classList.toggle('active');
      if (isActive) {
        blockDropdown.style.top = (sideTrigger.offsetTop + 36) + 'px';
      }
    });

    function insertBlock(type) {
      editor.focus();
      blockDropdown.classList.remove('active');
      sideTrigger.style.display = 'none';

      if (type === 'h2') {
        document.execCommand('formatBlock', false, '<h2>');
      } else if (type === 'h3') {
        document.execCommand('formatBlock', false, '<h3>');
      } else if (type === 'quote') {
        document.execCommand('formatBlock', false, '<blockquote>');
      } else if (type === 'pullquote') {
        const pqHtml = `<div class="pull-quote">&ldquo;Escribe aquí la cita destacada&rdquo;</div><p><br></p>`;
        document.execCommand('insertHTML', false, pqHtml);
      } else if (type === 'dots') {
        const dotsHtml = `<div class="divider-dots">&bull; &bull; &bull;</div><p><br></p>`;
        document.execCommand('insertHTML', false, dotsHtml);
      }
      triggerAutoSave();
    }

    function insertPlateAction() {
      const url = prompt('URL o nombre de archivo de la imagen:');
      if (!url) return;
      blockDropdown.classList.remove('active');
      sideTrigger.style.display = 'none';

      const figHtml = `
        <figure class="editorial-plate" contenteditable="false">
          <div class="plate-img-wrap">
            <img src="${url}" alt="Lámina de Archivo">
          </div>
          <figcaption class="plate-caption" contenteditable="true">
            <span class="plate-number">[FIG. ARCHIVO]</span>
            Añade aquí el comentario analítico o técnico de la pieza...
          </figcaption>
        </figure><p><br></p>`;
      
      document.execCommand('insertHTML', false, figHtml);
      triggerAutoSave();
    }

    // ==========================================
    // NOTAS AL PIE CON RENUMERACIÓN DINÁMICA
    // ==========================================
    function reindexFootnotes() {
      const buttons = editor.querySelectorAll('.footnote-button');
      const listItems = Array.from(fList.querySelectorAll('li'));

      if (buttons.length === 0) {
        fSec.style.display = 'none';
        fList.innerHTML = '';
        return;
      }

      fSec.style.display = 'block';

      const contentMap = {};
      listItems.forEach(li => {
        const id = li.getAttribute('data-fn-id');
        if (id) contentMap[id] = li.innerHTML;
      });

      fList.innerHTML = '';

      buttons.forEach((btn, idx) => {
        const newNum = idx + 1;
        const oldId = btn.getAttribute('data-fn');
        
        btn.setAttribute('data-fn', newNum);
        btn.textContent = '[' + newNum + ']';

        const li = document.createElement('li');
        li.id = 'fn-item-' + newNum;
        li.setAttribute('data-fn-id', newNum);
        
        if (contentMap[oldId]) {
          li.innerHTML = contentMap[oldId];
        } else {
          li.innerHTML = 'Referencia documental o comentario de la nota [' + newNum + ']...';
        }
        fList.appendChild(li);
      });
    }

    function insertFootnoteAction() {
      editor.focus();
      blockDropdown.classList.remove('active');
      hideBubbleMenu();

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'footnote-button';
      btn.setAttribute('contenteditable', 'false');
      btn.textContent = '[*]';

      const sel = window.getSelection();
      if (sel.rangeCount) {
        const range = sel.getRangeAt(0);
        range.collapse(false);
        range.insertNode(btn);
        range.setStartAfter(btn);
        sel.removeAllRanges();
        sel.addRange(range);
      } else {
        editor.appendChild(btn);
      }

      reindexFootnotes();
      triggerAutoSave();
    }

    // ==========================================
    // BURBUJA EMERGENTE FLOTANTE (POPOVER)
    // ==========================================
    function closePopover() {
      popover.style.display = 'none';
      if (currentPopoverBtn) currentPopoverBtn.classList.remove('active');
      currentPopoverBtn = null;
    }

    document.addEventListener('click', (e) => {
      const fnBtn = e.target.closest('.footnote-button');
      if (fnBtn) {
        e.stopPropagation();
        const fnId = fnBtn.getAttribute('data-fn');
        const targetLi = document.querySelector('[data-fn-id="' + fnId + '"]') || document.getElementById('fn-item-' + fnId);

        // Si ya está abierta para el mismo botón, se cierra (comportamiento toggle)
        if (currentPopoverBtn === fnBtn && popover.style.display === 'block') {
          closePopover();
          return;
        }

        if (targetLi) {
          if (currentPopoverBtn) currentPopoverBtn.classList.remove('active');
          currentPopoverBtn = fnBtn;
          fnBtn.classList.add('active');

          popLabel.textContent = 'NOTA [' + fnId + ']';
          popContent.innerHTML = targetLi.innerHTML;
          popover.style.display = 'block';

          const rect = fnBtn.getBoundingClientRect();
          const popWidth = popover.offsetWidth || 300;
          let left = rect.left + window.scrollX - (popWidth / 2) + (rect.width / 2);

          if (left < 15) left = 15;
          if (left + popWidth > window.innerWidth - 15) left = window.innerWidth - popWidth - 15;

          let top = rect.bottom + window.scrollY + 8;
          popover.style.left = left + 'px';
          popover.style.top = top + 'px';
        }
        return;
      }

      if (!popover.contains(e.target)) {
        closePopover();
      }

      if (!blockDropdown.contains(e.target) && e.target !== sideTrigger) {
        blockDropdown.classList.remove('active');
      }
    });

    // Guardado y Métricas
    function updateMetrics() {
      const text = editor.innerText || '';
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      wordMetric.textContent = words + ' palabras';
    }

    function triggerAutoSave() {
      updateMetrics();
      const draft = {
        slug: slugInput.value,
        id: idInput.value,
        meta: metaInput.value,
        title: titleInput.value,
        subtitle: subtitleInput.value,
        body: editor.innerHTML,
        footnotes: fList.innerHTML,
        hasFn: fSec.style.display !== 'none'
      };
      localStorage.setItem('lj_substack_draft', JSON.stringify(draft));
      saveStatus.textContent = 'Guardado';
      saveStatus.classList.add('saved');
    }

    function loadDraft() {
      const raw = localStorage.getItem('lj_substack_draft');
      if (raw) {
        try {
          const draft = JSON.parse(raw);
          slugInput.value = draft.slug || '';
          idInput.value = draft.id || '';
          metaInput.value = draft.meta || '';
          titleInput.value = draft.title || '';
          subtitleInput.value = draft.subtitle || '';
          if (draft.body) editor.innerHTML = draft.body;
          if (draft.footnotes) fList.innerHTML = draft.footnotes;
          if (draft.hasFn) fSec.style.display = 'block';
          reindexFootnotes();
        } catch(e) {}
      } else {
        slugInput.value = 'poetica-del-sample';
        idInput.value = '[TXT.01]';
        metaInput.value = 'BOGOTÁ // ENSAYO MONOGRÁFICO // 2026';
        titleInput.value = 'LA POÉTICA DEL SAMPLE Y EL MINIMALISMO EN EL RAP';
        subtitleInput.value = 'Aproximaciones al vacío, la micro-repetición y el grano analógico como documento.';
      }
      updateMetrics();
    }

    // Escuchadores
    editor.addEventListener('input', () => {
      saveStatus.textContent = 'Guardando...';
      saveStatus.classList.remove('saved');
      reindexFootnotes();
      triggerAutoSave();
    });

    editor.addEventListener('keyup', () => {

  <script>
    if (window.location.pathname.endsWith('.html')) {

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.footnote-button');
      if (btn) {
        e.stopPropagation();
        const fnId = btn.getAttribute('data-fn');
        const targetLi = document.querySelector('[data-fn-id="' + fnId + '"]') || document.getElementById('fn-item-' + fnId);

        if (currentTrigger === btn && popover.style.display === 'block') {
          closePopover();
          return;
        }

        if (targetLi) {
          if (currentTrigger) currentTrigger.classList.remove('active');
          currentTrigger = btn;
          btn.classList.add('active');

          popLabel.textContent = 'NOTA [' + fnId + ']';
          popContent.innerHTML = targetLi.innerHTML;
          popover.style.display = 'block';

          const rect = btn.getBoundingClientRect();
          const popWidth = popover.offsetWidth || 300;
          let left = rect.left + window.scrollX - (popWidth / 2) + (rect.width / 2);
          
          if (left < 15) left = 15;
          if (left + popWidth > window.innerWidth - 15) left = window.innerWidth - popWidth - 15;

          let top = rect.bottom + window.scrollY + 8;
          popover.style.left = left + 'px';
          popover.style.top = top + 'px';
        }
        return;
      }

      if (!popover.contains(e.target)) {
        closePopover();
      }
    });

    window.addEventListener('resize', closePopover);
    window.addEventListener('scroll', () => { if (popover.style.display === 'block') closePopover(); }, { passive: true });
