<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Directivas anti-caché del navegador -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Love Jones — Archivo & Lecturas</title>
  <link rel="icon" type="image/jpeg" href="LoveJones pic1.jpeg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0c0b0a;
      --card-bg: #141211;
      --text: #f2ede4;
      --text-muted: #a89f91;
      --gold: #c2a661;
      --accent: #8f3024;
      --border: #24201d;
      --font-serif: 'Lora', Georgia, serif;
      --font-mono: 'Space Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-serif);
      line-height: 1.95;
      padding: 0 1.5rem;
    }
    header {
      max-width: 760px;
      margin: 2.5rem auto 3.5rem auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 1.2rem;
    }
    header a { color: var(--text-muted); text-decoration: none; }
    header a:hover { color: var(--gold); }
    .container { max-width: 760px; margin: 0 auto 6rem auto; }
    
    /* Tarjetas de Ensayos */
    .archive-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 2rem;
      margin-bottom: 2rem;
    }
    .card-ficha {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--gold);
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }
    .card-title {
      font-size: 1.6rem;
      font-weight: 400;
      margin-bottom: 0.8rem;
      color: var(--text);
    }
    .card-desc {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }
    .read-btn {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--gold);
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .read-btn:hover { text-decoration: underline; }

    /* Sala de Lectura Monográfica */
    #articleView { display: none; }
    #articleContent p { margin-bottom: 2rem; font-size: 1.15rem; text-align: justify; }
    #articleContent blockquote {
      border-left: 2px solid var(--accent);
      padding-left: 1.5rem;
      margin: 2.5rem 0;
      font-style: italic;
      color: #ded7cc;
    }
    #articleContent img { max-width: 100%; height: auto; margin: 2rem 0; border: 1px solid var(--border); }
    .back-link {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--gold);
      cursor: pointer;
      margin-bottom: 2rem;
      display: inline-block;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← LOVE JONES ARCHIVE</a>
    <span>BIBLIOTECA</span>
  </header>

  <div class="container">
    <!-- Listado de Ensayos -->
    <div id="listView">
      <div id="essaysList">Cargando catálogo...</div>
    </div>

    <!-- Lectura individual del ensayo -->
    <article id="articleView">
      <span class="back-link" onclick="showList()">← VOLVER AL ÍNDICE</span>
      <div id="articleContent"></div>
    </article>
  </div>

  <script>
    const REPO = 'loveejonnes/Love-Jones';
    const BRANCH = 'main';

    async function loadEssays() {
      const listContainer = document.getElementById('essaysList');
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/ensayos?ref=${BRANCH}`);
        if (!res.ok) {
          listContainer.innerHTML = '<p style="color:var(--text-muted);font-family:var(--font-mono);font-size:0.85rem;">Aún no hay material publicado por ahora, regrese pronto.</p>';
          return;
        }
        const files = await res.json();
        const mdFiles = files.filter(f => f.name.endsWith('.md'));
        
        if (mdFiles.length === 0) {
          listContainer.innerHTML = '<p style="color:var(--text-muted);font-family:var(--font-mono);font-size:0.85rem;">Aún no hay material publicado por ahora, regrese pronto.</p>';
          return;
        }

        listContainer.innerHTML = '';
        for (const file of mdFiles) {
          const contentRes = await fetch(file.download_url);
          const text = await contentRes.text();
          
          const titleMatch = text.match(/title:\s*["']?(.*?)["']?$/m);
          const descMatch = text.match(/description:\s*["']?(.*?)["']?$/m);
          const fichaMatch = text.match(/ficha:\s*["']?(.*?)["']?$/m);

          const title = titleMatch ? titleMatch[1] : file.name.replace('.md', '');
          const desc = descMatch ? descMatch[1] : '';
          const ficha = fichaMatch ? fichaMatch[1] : '[EXPEDIENTE]';

          const card = document.createElement('div');
          card.className = 'archive-card';
          card.innerHTML = `
            <div class="card-ficha">${ficha}</div>
            <h2 class="card-title">${title}</h2>
            <p class="card-desc">${desc}</p>
            <a href="#" class="read-btn" onclick="readEssay('${file.download_url}'); return false;">Leer Expediente →</a>
          `;
          listContainer.appendChild(card);
        }
      } catch (e) {
        listContainer.innerHTML = '<p style="color:var(--text-muted);font-family:var(--font-mono);font-size:0.85rem;">Aún no hay material publicado por ahora, regrese pronto.</p>';
      }
    }

    async function readEssay(url) {
      const contentArea = document.getElementById('articleContent');
      document.getElementById('listView').style.display = 'none';
      document.getElementById('articleView').style.display = 'block';
      window.scrollTo(0, 0);

      contentArea.innerHTML = '<p style="font-family:var(--font-mono);font-size:0.85rem;color:var(--text-muted);">Desclasificando archivo...</p>';

      const res = await fetch(url);
      const raw = await res.text();
      const body = raw.replace(/^---[\s\S]*?---/, '');
      contentArea.innerHTML = marked.parse(body);
    }

    function showList() {
      document.getElementById('articleView').style.display = 'none';
      document.getElementById('listView').style.display = 'block';
      window.scrollTo(0, 0);
    }

    loadEssays();
  </script>
</body>
</html>
