<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Jones — Archivo</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="LoveJones pic1.jpeg">

  <!-- Tipografías de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #111111;
      --card-bg: #161413;
      --accent-color: #9e3a2b;
      --accent-hover: #b84534;
      --text-main: #f4ecd8;
      --text-muted: #b8b09f;
      --border-color: #26211f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Lora', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.85;
    }

    /* Encabezado */
    header {
      width: 100%;
      padding: 2.8rem 2.5rem;
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-logo {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 700;
      transition: opacity 0.2s ease;
    }

    .brand-logo:hover {
      opacity: 0.85;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .nav-link {
      font-family: 'Space Grotesk', sans-serif;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      padding-bottom: 4px;
      border-bottom: 1.5px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text-main);
      border-bottom-color: var(--accent-color);
    }

    /* Espacio principal en blanco (fondo limpio) */
    main {
      flex: 1;
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
    }

    /* Pie de página */
    footer {
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.85rem;
      color: #6d665b;
    }

    @media (max-width: 820px) {
      header {
        padding: 1.8rem 1.5rem;
      }
      footer {
        flex-direction: column;
        gap: 0.8rem;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Encabezado con ARCHIVO en el centro -->
  <header>
    <a href="./" class="brand-logo">Love Jones</a>
    <nav class="header-nav">
      <a class="nav-link" href="https://substack.com/@loveejonnes" target="_blank" rel="noopener noreferrer">DROPGEMS</a>
      <a class="nav-link active" href="archivo.html">ARCHIVO</a>
      <a class="nav-link" href="contacto.html">CONTACTO</a>
    </nav>
  </header>

  <!-- Área vacía -->
  <main></main>

  <!-- Pie de página -->
  <footer>
    <div>&copy; Bogotá, Colombia.</div>
    <div>Love Jones</div>
  </footer>

  <script>
    if (window.location.pathname.endsWith('/archivo.html')) {
      const cleanPath = window.location.pathname.replace('/archivo.html', '/archivo');
      window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
    }
  </script>
</body>
</html>
