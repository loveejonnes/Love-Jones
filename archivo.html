<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Love Jones — Archivo</title>

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://loveejonnes.github.io/Love-Jones/archivo.html">
  <meta property="og:title" content="Love Jones — Archivo">
  <meta property="og:description" content="Archivo y biblioteca de textos de Love Jones.">
  <meta property="og:image" content="https://loveejonnes.github.io/Love-Jones/LoveJones%20pic1.jpeg">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="LoveJones pic1.jpeg">

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0d0c0b;
      --card-bg: #121110;
      --accent-color: #9e3527;
      --accent-hover: #b83f30;
      --text-main: #dfd7c8;
      --text-muted: #8c8476;
      --border-color: #2b2622;
      --font-mono: 'Space Mono', 'Courier Prime', monospace;
      --font-serif: 'Lora', Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { cursor: default; }
    a, button { cursor: pointer; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-serif);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.85;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
      width: 100%;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Cubo Cinemático Dinámico con Rebote Libre */
    .floating-companion {
      position: fixed;
      top: 0;
      left: 0;
      width: 74px;
      height: 85px;
      z-index: 500;
      pointer-events: auto;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      will-change: transform;
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.35));
      transition: filter 0.25s ease;
    }

    .floating-companion:active {
      cursor: grabbing;
      filter: drop-shadow(0 0 22px rgba(255, 230, 128, 0.9));
    }

    .companion-inner {
      width: 100%;
      height: 100%;
      transform-origin: center;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    header {
      width: 100%;
      padding: 2.6rem 2.5rem;
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--border-color);
      position: relative;
      z-index: 20;
    }

    .brand-logo {
      font-family: var(--font-mono);
      font-size: 1.25rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 700;
      transition: opacity 0.2s ease;
    }

    .brand-logo:hover { opacity: 0.85; }

    .header-nav { display: flex; align-items: center; gap: 2.2rem; }

    .nav-link {
      font-family: var(--font-mono);
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      padding-bottom: 4px;
      border-bottom: 1px dashed transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--text-main);
      border-bottom-color: var(--accent-color);
    }

    main {
      flex: 1;
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }

    footer {
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem;
      border-top: 1px dashed var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      color: #5c554b;
      position: relative;
      z-index: 20;
    }

    @media (max-width: 820px) {
      header { padding: 1.8rem 1.4rem; }
      .brand-logo { font-size: 1.1rem; }
      .header-nav { gap: 1.4rem; }
      .floating-companion { width: 54px; height: 62px; }
      footer { flex-direction: column; gap: 0.6rem; text-align: center; padding: 2rem 1.4rem; }
    }
  </style>
</head>
<body>

  <!-- Cubo Cinemático Dinámico con Rebote Libre y Soporte Táctil -->
  <div class="floating-companion" id="companionBadge" title="Love Jones — Toca o persigue">
    <div class="companion-inner" id="companionInner">
      <svg viewBox="0 0 120 135" width="100%" height="100%">
        <defs>
          <filter id="goldCyberGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.2" result="glow" />
            <feMerge>
              <feMergeNode in="glow" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>

          <linearGradient id="cyberGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="25%" stop-color="#ffe680" />
            <stop offset="65%" stop-color="#d4af37" />
            <stop offset="100%" stop-color="#997825" />
          </linearGradient>

          <linearGradient id="cyberInnerGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#59430c" />
            <stop offset="100%" stop-color="#c5a028" />
          </linearGradient>
        </defs>

        <g stroke="url(#cyberInnerGrad)" stroke-width="1.2" stroke-dasharray="2.5 2" fill="none">
          <line x1="60" y1="82" x2="60" y2="52" />
          <line x1="28" y1="34" x2="60" y2="52" />
          <line x1="92" y1="34" x2="60" y2="52" />
        </g>

        <polygon points="60,8 92,26 92,68 60,86 28,68 28,26" 
                 stroke="url(#cyberGoldGrad)" stroke-width="1.8" fill="none" filter="url(#goldCyberGlow)" />

        <g stroke="url(#cyberGoldGrad)" stroke-width="1.4" fill="none">
          <line x1="60" y1="46" x2="60" y2="86" />
          <line x1="60" y1="46" x2="28" y2="26" />
          <line x1="60" y1="46" x2="92" y2="26" />
        </g>

        <circle cx="60" cy="8" r="2.2" fill="#ffffff" filter="url(#goldCyberGlow)" />
        <circle cx="92" cy="26" r="2" fill="#ffe680" />
        <circle cx="92" cy="68" r="2" fill="#ffe680" />
        <circle cx="60" cy="86" r="2.2" fill="#ffffff" filter="url(#goldCyberGlow)" />
        <circle cx="28" cy="68" r="2" fill="#ffe680" />
        <circle cx="28" cy="26" r="2" fill="#ffe680" />

        <g font-family="'Space Mono', monospace" font-size="21" font-weight="700" 
           fill="url(#cyberGoldGrad)" filter="url(#goldCyberGlow)" letter-spacing="1">
          <text x="60" y="53" text-anchor="middle" dominant-baseline="central">LJ</text>
        </g>

        <g font-family="'Space Mono', monospace" font-size="7.5" font-weight="700" letter-spacing="2">
          <text x="18" y="112" fill="#ffffff" filter="url(#goldCyberGlow)">L</text>
          <text x="25" y="112" fill="#d4af37" font-weight="400">OVE</text>
          <text x="64" y="112" fill="#ffffff" filter="url(#goldCyberGlow)">J</text>
          <text x="71" y="112" fill="#d4af37" font-weight="400">ONES</text>
        </g>
      </svg>
    </div>
  </div>

  <header>
    <a href="./" class="brand-logo">Love Jones</a>
    <nav class="header-nav">
      <a class="nav-link" href="https://substack.com/@loveejonnes" target="_blank" rel="noopener noreferrer">DROPGEMS</a>
      <a class="nav-link active" href="archivo.html?v=2">ARCHIVO</a>
      <a class="nav-link" href="contacto.html">CONTACTO</a>
    </nav>
  </header>

  <main></main>

  <footer>
    <div>&copy; Bogotá, Colombia.</div>
    <div>Love Jones</div>
  </footer>

  <script>
    if (window.location.pathname.endsWith('/archivo.html')) {
      const cleanPath = window.location.pathname.replace('/archivo.html', '/archivo');
      window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
    }

    const companion = document.getElementById('companionBadge');
    const companionInner = document.getElementById('companionInner');

    let posX = Math.max(20, window.innerWidth - 110);
    let posY = Math.max(20, window.innerHeight - 130);
    let velX = (Math.random() > 0.5 ? 1 : -1) * 1.35;
    let velY = (Math.random() > 0.5 ? 1 : -1) * 1.15;

    const baseSpeed = 1.25;
    let pointerX = -9999, pointerY = -9999;

    function setPointerPos(x, y) {
      pointerX = x;
      pointerY = y;
    }

    function clearPointerPos() {
      pointerX = -9999;
      pointerY = -9999;
    }

    window.addEventListener('mousemove', (e) => setPointerPos(e.clientX, e.clientY));
    window.addEventListener('mouseleave', clearPointerPos);

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        setPointerPos(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      setTimeout(clearPointerPos, 400);
    }, { passive: true });

    function triggerBounceImpulse() {
      companionInner.style.transform = 'scale(0.72) rotate(15deg)';
      setTimeout(() => { companionInner.style.transform = 'scale(1) rotate(0deg)'; }, 350);

      const launchAngle = Math.random() * Math.PI * 2;
      const launchForce = 13 + Math.random() * 7;
      velX = Math.cos(launchAngle) * launchForce;
      velY = Math.sin(launchAngle) * launchForce;
    }

    companion.addEventListener('click', (e) => {
      e.stopPropagation();
      triggerBounceImpulse();
    });

    companion.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      triggerBounceImpulse();
    }, { passive: false });

    function updatePhysics() {
      if (!companion) return;

      const compW = companion.offsetWidth || 54;
      const compH = companion.offsetHeight || 62;
      const maxX = Math.max(0, window.innerWidth - compW);
      const maxY = Math.max(0, window.innerHeight - compH);

      const centerX = posX + compW / 2;
      const centerY = posY + compH / 2;
      const distX = pointerX - centerX;
      const distY = pointerY - centerY;
      const dist = Math.hypot(distX, distY);
      const repulseRadius = window.innerWidth <= 820 ? 100 : 135;

      if (dist < repulseRadius && dist > 0) {
        const force = ((repulseRadius - dist) / repulseRadius) * 2.6;
        const angle = Math.atan2(distY, distX);
        velX -= Math.cos(angle) * force;
        velY -= Math.sin(angle) * force;
      }

      const curSpeed = Math.hypot(velX, velY);
      if (curSpeed > baseSpeed) {
        velX *= 0.965;
        velY *= 0.965;
      } else if (curSpeed < 0.55) {
        velX = (Math.random() - 0.5) * baseSpeed;
        velY = (Math.random() - 0.5) * baseSpeed;
      }

      posX += velX;
      posY += velY;

      if (posX <= 0) { posX = 0; velX = -velX * 0.95; }
      else if (posX >= maxX) { posX = maxX; velX = -velX * 0.95; }

      if (posY <= 0) { posY = 0; velY = -velY * 0.95; }
      else if (posY >= maxY) { posY = maxY; velY = -velY * 0.95; }

      companion.style.transform = `translate3d(${posX.toFixed(2)}px, ${posY.toFixed(2)}px, 0)`;

      requestAnimationFrame(updatePhysics);
    }

    requestAnimationFrame(updatePhysics);

    window.addEventListener('resize', () => {
      const compW = companion.offsetWidth || 54;
      const compH = companion.offsetHeight || 62;
      posX = Math.min(posX, Math.max(0, window.innerWidth - compW));
      posY = Math.min(posY, Math.max(0, window.innerHeight - compH));
    });
  </script>
</body>
</html>
